name: Validate public site

on:
  pull_request:
    paths:
      - "prototypes/semantic-site/**"
      - ".github/workflows/site-validate.yml"
  push:
    branches:
      - master
    paths:
      - "prototypes/semantic-site/**"
      - ".github/workflows/site-validate.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/semantic-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: prototypes/semantic-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build public site
        run: npm run build

      - name: Reject internal-only public markers
        run: |
          if grep -R -n -i -E 'REVIEW_REQUIRED|PROTOTYPE_LIMITATION|DEFERRED|Diagnostic Fox|logs\.root|diagnostics\.iige|operator\.root|portfolio\.root|contact\.root|experiments\.root|STABLE OBJECT IDS?|semantic object IDs?|IIGE INTEGRATION SHELL|Prototype status|future bridge|UNKNOWN / NOT CONNECTED|REQUEST_INTERACTIVE_EXPERIENCE|data-object-id' dist; then
            echo "Internal-only marker found in generated public output."
            exit 1
          fi
